name: Main

on:
  push:
    branches:
      - master
      - "push-action/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main-generated-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Sync connector presets
        run: pnpm run pnpm:devPreinstall

      - name: Check connector generated files
        run: |
          if ! git diff --exit-code -- packages/connectors; then
            echo "Connector package presets are out of sync. Run 'pnpm run pnpm:devPreinstall' and commit the changes."
            exit 1
          fi

  main-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Build
        run: pnpm ci:build

  main-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Prepack
        run: pnpm prepack

      - name: Check
        run: pnpm -r check

  main-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Prepack
        run: pnpm prepack

      - name: Lint
        run: pnpm ci:lint

      - name: Stylelint
        run: pnpm ci:stylelint

  main-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0

      - name: Build for test
        run: pnpm -r build:test

      - name: Install playwright for element tests
        working-directory: ./packages/elements
        run: pnpm exec playwright install --with-deps

      - name: Test
        run: pnpm ci:test

      - name: Codecov core
        uses: codecov/codecov-action@v7
        with:
          flags: core
          directory: ./packages/core
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov ui
        uses: codecov/codecov-action@v7
        with:
          flags: ui
          directory: ./packages/ui
          token: ${{ secrets.CODECOV_TOKEN }}

  main-alteration:
    runs-on: ubuntu-latest

    steps:
      # ** Checkout current fork and supported fork upgrade baseline **
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: ./fresh

      # v0.4.0 is the latest released fork version. Official Logto-to-fork migrations are not
      # supported, so test the upgrade path that deployments actually use.
      - uses: actions/checkout@v7
        with:
          ref: v0.4.0
          path: ./alteration

      - id: baseline-version
        working-directory: ./alteration
        run: |
          version=$(node -p "require('./packages/schemas/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # ** End **

      - name: Copy lockfile # Make setup workflow happy
        run: cp ./fresh/pnpm-lock.yaml ./

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^22.14.0
          run-install: false

      # ** Prepack packages **
      - name: Prepack fresh
        working-directory: ./fresh
        run: pnpm i && pnpm prepack

      - name: Prepack alteration
        working-directory: ./alteration
        run: pnpm i && pnpm prepack
      # ** End **

      - name: Setup Postgres
        uses: ikalnytskyi/action-setup-postgres@v8

      # ** Setup up-to-date databases and compare (test `up`) **
      - name: Setup fresh database
        working-directory: ./fresh
        run: pnpm cli db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Setup alteration database
        working-directory: ./alteration
        run: |
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Run alteration scripts
        working-directory: ./fresh
        run: pnpm cli db alt deploy next
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/alteration

      - name: Compare databases
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh alteration
      # ** End **

      # ** Setup old databases and compare (test `down`) **
      - name: Setup old database
        working-directory: ./alteration
        run: |
          cd packages/cli
          pnpm start db seed --test
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/old

      - name: Revert fresh database to old
        working-directory: ./fresh
        run: pnpm cli db alt r v${{ steps.baseline-version.outputs.version }}
        env:
          ALTERATION_TEST: true
          DB_URL: postgres://postgres:postgres@localhost:5432/fresh

      - name: Compare manifests
        working-directory: ./fresh
        run: node .scripts/compare-database.js fresh old
      # ** End **

      - name: Check alteration sequence
        working-directory: ./fresh
        run: node .scripts/check-alterations-sequence.js
